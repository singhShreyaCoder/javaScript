<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumina Calculator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body data-theme="dark">

    <!-- Animated background blobs -->
    <div class="bg-blob blob-1"></div>
    <div class="bg-blob blob-2"></div>
    <div class="bg-blob blob-3"></div>

    <main class="app">
        <!-- History panel -->
        <aside class="history-panel" id="historyPanel">
            <div class="history-header">
                <span class="history-title">History</span>
                <button class="icon-btn" id="clearHistoryBtn" title="Clear history" aria-label="Clear history">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6h14z"/>
                    </svg>
                </button>
            </div>
            <div class="history-list" id="historyList">
                <p class="history-empty">No calculations yet</p>
            </div>
        </aside>

        <!-- Calculator -->
        <section class="calculator">
            <div class="calc-header">
                <div class="brand">
                    <span class="brand-dot"></span>
                    <span class="brand-name">Lumina</span>
                </div>
                <button class="icon-btn" id="themeToggle" title="Toggle theme" aria-label="Toggle theme">
                    <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="4"/>
                        <path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
                    </svg>
                    <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                    </svg>
                </button>
            </div>

            <div class="display">
                <div class="expression" id="expression">&nbsp;</div>
                <input type="text" id="display" readonly aria-label="Calculator display">
                <div class="display-shine"></div>
            </div>

            <div class="buttons">
                <button class="btn btn-func" data-action="clear">AC</button>
                <button class="btn btn-func" data-action="backspace" title="Backspace" aria-label="Backspace">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"/>
                        <path d="M18 9l-6 6M12 9l6 6"/>
                    </svg>
                </button>
                <button class="btn btn-func" data-value="%">%</button>
                <button class="btn btn-op" data-value="/" aria-label="Divide">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                        <line x1="4" y1="20" x2="20" y2="4"/>
                    </svg>
                </button>

                <button class="btn btn-num" data-value="7">7</button>
                <button class="btn btn-num" data-value="8">8</button>
                <button class="btn btn-num" data-value="9">9</button>
                <button class="btn btn-op" data-value="*" aria-label="Multiply">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                        <path d="M12 4v16M4 12h16"/>
                    </svg>
                </button>

                <button class="btn btn-num" data-value="4">4</button>
                <button class="btn btn-num" data-value="5">5</button>
                <button class="btn btn-num" data-value="6">6</button>
                <button class="btn btn-op" data-value="-" aria-label="Subtract">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                        <path d="M4 12h16"/>
                    </svg>
                </button>

                <button class="btn btn-num" data-value="1">1</button>
                <button class="btn btn-num" data-value="2">2</button>
                <button class="btn btn-num" data-value="3">3</button>
                <button class="btn btn-op" data-value="+" aria-label="Add">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                        <path d="M12 4v16M4 12h16"/>
                    </svg>
                </button>

                <button class="btn btn-func" data-action="sign" aria-label="Toggle sign">+/−</button>
                <button class="btn btn-num" data-value="0">0</button>
                <button class="btn btn-num" data-value=".">.</button>
                <button class="btn btn-equals" data-action="equals" aria-label="Equals">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                        <path d="M4 8h16M4 16h16"/>
                    </svg>
                </button>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
